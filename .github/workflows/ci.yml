name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run src/cli.ts --version
      - name: Verify standalone build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cd src
          bun build --compile --target=bun-linux-x64 \
            --asset=./prompt.md --asset=./prompts --asset=./skills \
            --outfile=../dist/reviewbot ./cli.ts
          ../dist/reviewbot --version
